<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="reelocations architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d2430"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1a7f37"/></marker>
  </defs>
  <style>
    text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
    .box{fill:#fff;stroke:#1d2430;stroke-width:1.2}
    .key{fill:#eef7f1;stroke:#1a7f37;stroke-width:1.6}
    .zone{fill:#f3f5f8;stroke:#c9d0db;stroke-dasharray:4 3}
    .opt{fill:#fafafa;stroke:#c9d0db;stroke-dasharray:6 4}
    .ext{fill:#fff8e6;stroke:#9a6700;stroke-width:1}
    .t{font-size:12.5px;font-weight:600;fill:#1d2430}
    .s{font-size:10.5px;fill:#4b5563}
    .z{font-size:11px;font-weight:700;fill:#5b6576;letter-spacing:.04em}
    .l{stroke:#1d2430;stroke-width:1.3;fill:none;marker-end:url(#a)}
    .lg{stroke:#1a7f37;stroke-width:2;fill:none;marker-end:url(#g)}
    .d{stroke:#9a6700;stroke-width:1;fill:none;stroke-dasharray:3 3;marker-end:url(#a)}
    .lo{stroke:#8b95a5;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    .n{font-size:11px;fill:#1f6feb;font-weight:700}
    .ng{font-size:11px;fill:#1a7f37;font-weight:700}
  </style>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- ============ iPhone ============ -->
  <rect class="zone" x="10" y="36" width="220" height="430" rx="10"/>
  <text class="z" x="22" y="54">IPHONE</text>
  <rect class="box" x="22" y="64" width="196" height="44" rx="7"/>
  <text class="t" x="32" y="82">Instagram</text><text class="s" x="32" y="98">Reel → Share → Save Reel to Map</text>
  <rect class="box" x="22" y="128" width="196" height="76" rx="7"/>
  <text class="t" x="32" y="146">Shortcut "Save Reel to Map"</text>
  <text class="s" x="32" y="162">installed from the iCloud link,</text>
  <text class="s" x="32" y="176">your personal link pasted once</text>
  <text class="s" x="32" y="192">sends: Reel link + screenshot</text>
  <rect class="box" x="22" y="240" width="196" height="76" rx="7"/>
  <text class="t" x="32" y="258">Web app (Home Screen)</text>
  <text class="s" x="32" y="274">Map · Nearby · New · Starred</text>
  <text class="s" x="32" y="288">Approximate pins · Review Queue</text>
  <text class="s" x="32" y="302">Setup · AI Balance</text>
  <rect class="key" x="22" y="352" width="196" height="76" rx="7"/>
  <text class="t" x="32" y="370">Google Maps app</text>
  <text class="s" x="32" y="386">You → Saved → Reelocations</text>
  <text class="s" x="32" y="400">the real listing: normal place card</text>
  <text class="s" x="32" y="414">(My Maps: You → Saved → Maps)</text>
  <path class="l" d="M120,108 V126"/>

  <!-- ============ Railway ============ -->
  <rect class="zone" x="262" y="36" width="406" height="430" rx="10"/>
  <text class="z" x="274" y="54">RAILWAY: ONE SERVICE (Docker · src/server.ts)</text>
  <rect class="box" x="274" y="64" width="382" height="40" rx="7"/>
  <text class="t" x="284" y="81">Intake   /api/intake/&lt;personal link&gt;</text><text class="s" x="284" y="96">the link says whose collection it is · each Reel processed once</text>
  <rect class="box" x="274" y="116" width="382" height="94" rx="7"/>
  <text class="t" x="284" y="134">Pipeline</text>
  <text class="s" x="284" y="150">1  clues: caption or your note, text read from the screenshot (OCR)</text>
  <text class="s" x="284" y="164">2  OpenStreetMap + Google Places → exact listing and branch</text>
  <text class="s" x="284" y="178">3  OpenAI reads the screenshot only when text is not enough (≤ $3/month)</text>
  <text class="s" x="284" y="196">4  sure → pin · medium → Approximate pin · unsure → Review Queue</text>
  <rect class="key" x="274" y="222" width="382" height="82" rx="7"/>
  <text class="t" x="284" y="240">Google Maps list publisher</text>
  <text class="s" x="284" y="256">headless Chromium with your connected Google session</text>
  <text class="s" x="284" y="270">listing by Place ID → branch check → Save → "Reelocations"</text>
  <text class="s" x="284" y="284">only Reels shared after connecting · each listing once</text>
  <text class="s" x="284" y="298">branch unclear → Review Queue (This is the listing / None)</text>
  <rect class="box" x="274" y="316" width="382" height="76" rx="7"/>
  <text class="t" x="284" y="334">Web app + API</text>
  <text class="s" x="284" y="350">Google Sign-In · collections, invitations, leave / delete account</text>
  <text class="s" x="284" y="364">Review Queue: confirm, Replace or Add, Google Maps links</text>
  <text class="s" x="284" y="378">live updates (SSE) · AI Balance · /api/publisher/* (optional)</text>
  <rect class="box" x="274" y="404" width="382" height="48" rx="7"/>
  <text class="t" x="284" y="422">Volume /data</text>
  <text class="s" x="284" y="438">SQLite · screenshots · Google session (private, never in Git or logs)</text>
  <path class="l" d="M465,104 V114"/>
  <path class="l" d="M465,210 V220"/>

  <!-- iPhone ↔ server -->
  <path class="l" d="M218,166 C245,166 245,84 272,84"/>
  <text class="n" x="236" y="122">①</text>
  <path class="l" d="M272,354 C245,354 245,278 220,278"/>
  <text class="n" x="236" y="330">②</text>

  <!-- ============ External services ============ -->
  <text class="z" x="702" y="54">SERVICES (your own accounts)</text>
  <rect class="ext" x="700" y="64" width="250" height="38" rx="7"/>
  <text class="t" x="710" y="80">Google Sign-In</text><text class="s" x="710" y="94">ID token only, no password</text>
  <rect class="ext" x="700" y="112" width="250" height="38" rx="7"/>
  <text class="t" x="710" y="128">Google Places API (optional)</text><text class="s" x="710" y="142">exact listing and branch</text>
  <rect class="ext" x="700" y="160" width="250" height="38" rx="7"/>
  <text class="t" x="710" y="176">OpenStreetMap</text><text class="s" x="710" y="190">Nominatim · Overpass (free)</text>
  <rect class="ext" x="700" y="208" width="250" height="38" rx="7"/>
  <text class="t" x="710" y="224">OpenAI API (optional)</text><text class="s" x="710" y="238">reads a screenshot when needed</text>
  <rect class="key" x="700" y="262" width="250" height="52" rx="7"/>
  <text class="t" x="710" y="280">Google Maps — your account</text>
  <text class="s" x="710" y="294">private list "Reelocations"</text>
  <text class="s" x="710" y="308">(no API: the web app's own Save)</text>
  <path class="d" d="M656,140 C680,140 680,131 698,131"/>
  <path class="d" d="M656,160 C680,160 680,179 698,179"/>
  <path class="d" d="M656,178 C684,178 684,227 698,227"/>
  <path class="d" d="M656,334 C690,334 690,83 698,83"/>
  <path class="lg" d="M656,262 C680,262 680,288 698,288"/>
  <text class="ng" x="668" y="256">③</text>
  <path class="lg" d="M825,314 V484 H120 V430"/>
  <text class="ng" x="560" y="478">④ Google shows the list in the app</text>

  <!-- ============ Optional desktop publisher ============ -->
  <rect class="opt" x="262" y="512" width="688" height="112" rx="10"/>
  <text class="z" x="274" y="530">OPTIONAL: DESKTOP MY MAPS PUBLISHER (your computer must be on)</text>
  <rect class="box" x="274" y="542" width="300" height="66" rx="7"/>
  <text class="t" x="284" y="560">npm run cli -- publish</text>
  <text class="s" x="284" y="576">your own Chrome profile · scheduled task</text>
  <text class="s" x="284" y="590">downloads finished pins from the server</text>
  <rect class="box" x="640" y="542" width="296" height="66" rx="7"/>
  <text class="t" x="650" y="560">Google My Maps</text>
  <text class="s" x="650" y="576">"Reels · &lt;flag&gt; &lt;country&gt;": one map per country</text>
  <text class="s" x="650" y="590">custom pins at the listing's coordinates</text>
  <path class="lo" d="M300,452 V540"/>
  <text class="n" x="306" y="504">⑤</text>
  <path class="lo" d="M574,575 H638"/>
</svg>
