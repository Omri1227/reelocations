<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="reelocations architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d2430"/></marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>
  <style>
    text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
    .box{fill:#fff;stroke:#1d2430;stroke-width:1.2}
    .zone{fill:#f3f5f8;stroke:#c9d0db;stroke-dasharray:4 3}
    .ext{fill:#fff8e6;stroke:#9a6700;stroke-width:1}
    .t{font-size:12px;font-weight:600;fill:#1d2430}
    .s{font-size:10px;fill:#5b6576}
    .z{font-size:10.5px;font-weight:700;fill:#5b6576;letter-spacing:.04em}
    .l{stroke:#1d2430;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .d{stroke:#9a6700;stroke-width:1;fill:none;stroke-dasharray:3 3;marker-end:url(#a)}
    .n{font-size:10px;fill:#1f6feb;font-weight:600}
  </style>

  <!-- iPhone zone -->
  <rect class="zone" x="8" y="20" width="200" height="300" rx="8"/>
  <text class="z" x="18" y="36">IPHONE</text>
  <rect class="box" x="20" y="48" width="176" height="46" rx="6"/>
  <text class="t" x="30" y="67">Instagram</text><text class="s" x="30" y="83">Reel → Share → Share to…</text>
  <rect class="box" x="20" y="116" width="176" height="74" rx="6"/>
  <text class="t" x="30" y="135">Shortcut "Save Reel to Map"</text>
  <text class="s" x="30" y="151">Take Screenshot, optional note</text>
  <text class="s" x="30" y="165">POST share  (Reel link, note)</text>
  <text class="s" x="30" y="179">POST media  (JPEG, base64)</text>
  <rect class="box" x="20" y="214" width="176" height="46" rx="6"/>
  <text class="t" x="30" y="233">Web app (Home Screen)</text><text class="s" x="30" y="249">map, Nearby, Review Queue</text>
  <rect class="box" x="20" y="270" width="176" height="40" rx="6"/>
  <text class="t" x="30" y="288">Google Maps app</text><text class="s" x="30" y="302">You → Saved → Maps</text>
  <path class="l" d="M108,94 V114"/>

  <!-- Server zone -->
  <rect class="zone" x="250" y="20" width="270" height="300" rx="8"/>
  <text class="z" x="260" y="36">RAILWAY: ONE SERVICE (src/server.ts)</text>
  <rect class="box" x="262" y="48" width="246" height="40" rx="6"/>
  <text class="t" x="272" y="66">Intake  /api/intake/&lt;token&gt;</text><text class="s" x="272" y="80">personal token → user + collection</text>
  <rect class="box" x="262" y="100" width="246" height="92" rx="6"/>
  <text class="t" x="272" y="118">Pipeline (worker cycle)</text>
  <text class="s" x="272" y="134">1 clues: note, OCR of screenshot, speech</text>
  <text class="s" x="272" y="148">2 lookup: OpenStreetMap, Google Places</text>
  <text class="s" x="272" y="162">3 AI fallback (budget-capped, US$3/month)</text>
  <text class="s" x="272" y="176">4 sure → pin · unsure → Review Queue</text>
  <rect class="box" x="262" y="204" width="246" height="40" rx="6"/>
  <text class="t" x="272" y="222">SQLite + media on volume /data</text><text class="s" x="272" y="236">places, Reels, users, credentials</text>
  <rect class="box" x="262" y="256" width="246" height="54" rx="6"/>
  <text class="t" x="272" y="274">Web + APIs</text>
  <text class="s" x="272" y="288">/auth/google · /api/places · SSE /api/events</text>
  <text class="s" x="272" y="302">/api/publisher/export, /report, /events</text>
  <path class="l" d="M196,150 C228,150 230,68 260,68"/>
  <text class="n" x="208" y="112">①</text>
  <path class="l" d="M385,88 V98"/><path class="l" d="M385,192 V202"/><path class="l" d="M385,244 V254"/>
  <path class="l" d="M260,283 C232,283 230,240 198,240"/>
  <text class="n" x="214" y="270">②</text>

  <!-- External services -->
  <rect class="ext" x="560" y="40" width="190" height="38" rx="6"/>
  <text class="t" x="570" y="57">Google Identity Services</text><text class="s" x="570" y="71">sign-in ID token (no password)</text>
  <rect class="ext" x="560" y="90" width="190" height="38" rx="6"/>
  <text class="t" x="570" y="107">Google Places API (New)</text><text class="s" x="570" y="121">Text Search: listing, branch</text>
  <rect class="ext" x="560" y="140" width="190" height="38" rx="6"/>
  <text class="t" x="570" y="157">OpenStreetMap</text><text class="s" x="570" y="171">Nominatim, Overpass (free)</text>
  <rect class="ext" x="560" y="190" width="190" height="38" rx="6"/>
  <text class="t" x="570" y="207">OpenAI API</text><text class="s" x="570" y="221">reads frames when text is not enough</text>
  <rect class="ext" x="560" y="240" width="190" height="66" rx="6"/>
  <text class="t" x="570" y="257">Google Maps list (beta)</text><text class="s" x="570" y="271">headless Chromium, your session:</text><text class="s" x="570" y="285">listing by Place ID → Save</text><text class="s" x="570" y="299">→ app: Saved → Reelocations</text>
  <path class="l" d="M508,296 C535,296 535,266 558,266"/>
  <text class="n" x="512" y="320">⑤</text>
  <path class="d" d="M508,140 C535,140 535,109 558,109"/>
  <path class="d" d="M508,152 L558,159"/>
  <path class="d" d="M508,165 C535,165 535,209 558,209"/>
  <path class="d" d="M508,278 C540,278 535,59 558,59"/>

  <!-- Desktop zone -->
  <rect class="zone" x="250" y="340" width="500" height="82" rx="8"/>
  <text class="z" x="345" y="356">YOUR COMPUTER (OPTIONAL): DESKTOP PUBLISHER</text>
  <rect class="box" x="262" y="364" width="246" height="50" rx="6"/>
  <text class="t" x="272" y="382">npm run cli -- publish</text><text class="s" x="272" y="397">Windows task every 15 min, sync-only</text>
  <text class="s" x="272" y="409">drives your own Chrome profile</text>
  <rect class="box" x="560" y="364" width="190" height="50" rx="6"/>
  <text class="t" x="570" y="382">Google My Maps</text><text class="s" x="570" y="397">"Reels · &lt;flag&gt; &lt;country&gt;"</text><text class="s" x="570" y="409">one map per country, layer per city</text>
  <path class="l" d="M330,310 V362"/>
  <text class="n" x="336" y="336">③ export</text>
  <path class="l" d="M508,389 H558"/>
  <path class="l" d="M655,414 V442 H110 V314"/>
  <text class="n" x="118" y="385">④ Google syncs</text><text class="n" x="118" y="399">saved maps</text>
</svg>
